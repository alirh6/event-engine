global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The engine runs on the host during development (`npm run dev`).
  # When the app itself is containerized, replace host.docker.internal with
  # the service DNS name of the engine container.
  - job_name: event-engine
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'event-engine'
          environment: 'local'
